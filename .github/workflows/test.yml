name: Test

on:
  push:
    branches:
      - main
  pull_request:
  # The live Playwright integration test (browser-extract-retention) is gated
  # on RUN_LIVE_TESTS=1 and hits a real external URL, so it is NOT run on
  # push/PR (keeps those fast and hermetic). This scheduled job enables it so
  # the real browser-extraction path is exercised at least once a day; if it
  # flakes on a transient network/remote-site failure, the next run retries.
  schedule:
    - cron: "17 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    # Live browser path only under the scheduled run — see the `on:` note.
    env:
      RUN_LIVE_TESTS: ${{ github.event_name == 'schedule' && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run Vitest suite
        run: npm test

      - name: Run Python tests
        run: npm run test:py

      - name: Run typecheck
        run: npm run typecheck
